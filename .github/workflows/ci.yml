name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linkedout
          POSTGRES_PASSWORD: linkedout
          POSTGRES_DB: linkedout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linkedout -d linkedout_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://linkedout:linkedout@localhost:5432/linkedout_test
      JWT_SECRET: ci-test-secret
      PII_HASH_PEPPER: ci-test-pepper
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v
